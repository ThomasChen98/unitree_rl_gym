# Configuration for H1_2 robot with hybrid control optimized for boxing:
# - Lower body (12 DOF): controlled by policy
# - Upper body (15 DOF): controlled by boxing trajectories with enhanced PD gains
policy_path: "{LEGGED_GYM_ROOT_DIR}/logs/h1_2/exported/policies/policy_lstm_1.pt"
xml_path: "{LEGGED_GYM_ROOT_DIR}/resources/robots/h1_2/scene.xml"

# Total simulation time
simulation_duration: 60.0
# Simulation time step
simulation_dt: 0.002
# Controller update frequency (meets the requirement of simulation_dt * controll_decimation=0.02; 50Hz)
control_decimation: 10

# PD gains for lower body (12 DOF) - same as original
lower_body_kps: [200, 200, 200, 300, 40, 40, 
                 200, 200, 200, 300, 40, 40]
lower_body_kds: [2.5, 2.5, 2.5, 4, 2, 2,  
                 2.5, 2.5, 2.5, 4, 2, 2]

# Enhanced PD gains for upper body (15 DOF) - optimized for boxing stability
upper_body_kps: [200,  # torso - increased for better stability
                 120, 110, 100,200, 50, 40, 40,  # left arm - higher gains for faster response
                 120, 110, 80, 200, 50, 40, 40]  # right arm - higher gains for faster response
upper_body_kds: [10.0,  # torso - increased damping to reduce oscillations
                 3.0, 3.0, 3.0, 2.5, 2.5, 2.0, 2.0,  # left arm - higher damping
                 5.0, 5.0, 3.5, 2.5, 2.5, 2.0, 2.0]  # right arm - higher damping

# Default angles for lower body (12 DOF) - same as original
lower_body_default_angles: [0, -0.16, 0.0, 0.36, -0.2, 0.0, 
                           0, -0.16, 0.0, 0.36, -0.2, 0.0]

upper_body_default_angles: [0.0,  # torso
                           0.0, 0.0, 0.0, 1.5, 0.0, 0.0, 0.0,  # left arm
                           0.0, 0.0, 0.0, 1.5, 0.0, 0.0, 0.0]  # right arm


# Policy parameters (same as original for lower body)
ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25
cmd_scale: [2.0, 2.0, 0.25]
num_actions: 12  # Only lower body actions from policy
num_obs: 47

cmd_init: [0, 0, 0]

# Upper body trajectory parameters for boxing
trajectory_amplitude: 0.3  # Reduced amplitude for more controlled movement
trajectory_frequency: 0.3  # Slower frequency for more stable motion

# Boxing specific parameters
boxing_punch_force: 1.2    # Force multiplier for punch extension
boxing_guard_stiffness: 1.5  # Stiffness multiplier for guard position
boxing_transition_time: 0.4  # Smooth transition time between poses
