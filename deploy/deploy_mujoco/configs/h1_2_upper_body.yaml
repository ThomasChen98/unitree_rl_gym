# 
# policy_path: "{LEGGED_GYM_ROOT_DIR}/deploy/pre_train/h1_2/motion.pt"
policy_path: "{LEGGED_GYM_ROOT_DIR}/logs/h1_2/exported/policies/policy_lstm_1.pt"
# policy_path: "/home/yuxin/msc_humanoid/logs/rsl_rl/h12_flat/2025-01-14_20-29-04/exported/policy.pt"
# 使用27DOF模型
xml_path: "{LEGGED_GYM_ROOT_DIR}/resources/robots/h1_2/h1_2_27dof.xml"

# Total simulation time
simulation_duration: 60.0
# Simulation time step
simulation_dt: 0.002
# Controller update frequency (meets the requirement of simulation_dt * controll_decimation=0.02; 50Hz)
control_decimation: 10

# 下身12个关节的PD参数 (与原始12DOF配置相同)
kps: [200, 200, 200, 300, 40, 40, 
      200, 200, 200, 300, 40, 40]
kds: [2.5, 2.5, 2.5, 4, 2, 2,  
      2.5, 2.5, 2.5, 4, 2, 2]

# 下身12个关节的默认角度 (与原始12DOF配置相同)
default_angles: [0, -0.16, 0.0, 0.36, -0.2, 0.0, 
                 0, -0.16, 0.0, 0.36, -0.2, 0.0]

ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25
cmd_scale: [2.0, 2.0, 0.25]

# 只针对下身12个关节的策略
num_actions: 12
num_obs: 47

cmd_init: [0.5, 0, 0]
